<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Телефонный справочник</title><style>body{font:16px system-ui;background:#f4f6fa;margin:30px auto;max-width:900px;padding:0 14px;color:#162032}h1{color:#243c78}.panel{background:white;padding:18px;border-radius:12px;margin-bottom:16px;box-shadow:0 2px 8px #0001}input{padding:10px;margin:4px;border:1px solid #bdc5d0;border-radius:7px}button{padding:10px 12px;margin:3px;border:0;border-radius:7px;background:#234b99;color:#fff;cursor:pointer}button.delete{background:#a32e42}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #e4e8f0}#message{min-height:20px}</style></head><body><h1>Телефонный справочник</h1><div class="panel"><h2 id="formTitle">Новый контакт</h2><form id="form"><input id="name" placeholder="Имя" required><input id="phone" placeholder="Телефон" required><input id="email" type="email" placeholder="Email"><button type="submit">Сохранить</button><button type="button" id="reset">Отмена</button></form><p id="message" aria-live="polite"></p></div><div class="panel"><h2>Контакты</h2><table><thead><tr><th>Имя</th><th>Телефон</th><th>Email</th><th>Действия</th></tr></thead><tbody id="rows"></tbody></table></div><script>
let selected=null,contacts=[];const $=id=>document.getElementById(id);
async function api(url,options){const r=await fetch(url,options);const data=r.status===204?null:await r.json();if(!r.ok)throw Error(data.error||'Ошибка');return data;}
async function refresh(){contacts=await api('/api/contacts');$('rows').replaceChildren();for(const c of contacts){const tr=document.createElement('tr');for(const key of ['name','phone','email']){const td=document.createElement('td');td.textContent=c[key];tr.append(td);}const td=document.createElement('td');const edit=document.createElement('button');edit.textContent='Изменить';edit.onclick=()=>{$('formTitle').textContent='Редактирование контакта';selected=c.id;for(const x of ['name','phone','email'])$(x).value=c[x];};const del=document.createElement('button');del.textContent='Удалить';del.className='delete';del.onclick=async()=>{if(!confirm('Удалить контакт?'))return;await api('/api/contacts/'+c.id,{method:'DELETE'});await refresh();};td.append(edit,del);tr.append(td);$('rows').append(tr);}}
function reset(){$('form').reset();selected=null;$('formTitle').textContent='Новый контакт';}
$('reset').onclick=reset;$('form').onsubmit=async e=>{e.preventDefault();const payload=Object.fromEntries(['name','phone','email'].map(x=>[x,$(x).value]));try{await api('/api/contacts'+(selected?'/'+selected:''),{method:selected?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});$('message').textContent='Сохранено';reset();await refresh();}catch(err){$('message').textContent=err.message;}};refresh().catch(err=>$('message').textContent=err.message);
</script></body></html>
